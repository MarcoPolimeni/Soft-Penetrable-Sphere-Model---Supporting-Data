    - HNTR: {mw: 14.0,  sigma: 2.99, eps: 0.005, q: 1 }
    - ALA:  {mw: 66.0,  sigma: 5.02, eps: 0.005, q: 0 }
    - ILE:  {mw: 102.0, sigma: 5.8,  eps: 0.005, q: 0 }
    - LEU:  {mw: 102.0, sigma: 5.8,  eps: 0.005, q: 0 }
