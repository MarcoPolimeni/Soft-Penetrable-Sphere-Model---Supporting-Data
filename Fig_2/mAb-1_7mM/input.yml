moleculelist:
    - mAb_G_1:
        structure: /lustre/hpc/cms/marpoli/projects/5_Repo_SPS/Fig_2/pqr_inputs/mAb-1_7mM.pqr
        insdir: [0,0,0]
        insoffset: [0,0,0]
        keepcharges: False
        keeppos: False
        rigid: True

    - mAb_G_2:
        structure: /lustre/hpc/cms/marpoli/projects/5_Repo_SPS/Fig_2/pqr_inputs/mAb-1_7mM.pqr
        insdir: [0,0,0]
        insoffset: [0,0,150]
        keepcharges: False
        keeppos: False
        rigid: True

insertmolecules:
    - mAb_G_1: {N: 1, inactive: False}
    - mAb_G_2: {N: 1, inactive: False}
moves:    
    - moltransrot: {molecule: mAb_G_1, dir: [0,0,0], dprot: 0.5, dp: 0}
    - moltransrot: {molecule: mAb_G_2, dir: [0,0,1], dprot: 0.5, dp: 60}

analysis:
    - sanity: { nstep: 1000 }
    - density: { nstep: 1000 }
    - savestate: { file: state.json }
    - savestate: { file: confout.pqr }
    - xtcfile: { file: traj.xtc, nstep: 1000, nskip: 0 }
    - systemenergy: { file: energy.dat, nstep: 1000, nskip: 0 }
    - molrdf: {file: rdf.dat, nstep: 1, dr: 1, name1: mAb_G_1, name2: mAb_G_2, dim: 1}

