
temperature: 298.15
geometry: {type: cuboid, length: [300, 300, 2000] }
mcloop: {micro: 1000, macro: 1000}
random: {seed: hardware}
energy:
    - nonbonded:
        cutoff_g2g: 180
        default:
            - hardsphere:
                mixing: arithmetic

